<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gimnasio Mental</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gimnasio Mental">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2140;--muted:#6f6787;--card:#fff;--line:#ebe4fb;--pri:#7c4dff;--pri2:#ff6b8b;--ok:#1f9d55;--bad:#e5484d;--warn:#e69500}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:linear-gradient(160deg,#f3edff 0%,#fff0f4 55%,#eaf8ff 100%);color:var(--ink);min-height:100vh}
.app{max-width:560px;margin:0 auto;padding:18px 16px 48px}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;margin:0}
button{font-family:inherit;cursor:pointer;border:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.hello{font-size:15px;color:var(--muted);font-weight:700}
.hello b{display:block;font-family:Fredoka;font-size:26px;color:var(--ink);font-weight:600}
.iconbtn{background:#fff;border:1px solid var(--line);width:42px;height:42px;border-radius:14px;font-size:20px;display:grid;place-items:center}
.hero{background:linear-gradient(135deg,#7c4dff,#b25cff 55%,#ff6b8b);color:#fff;border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center;box-shadow:0 10px 30px -12px #7c4dff99}
.brain{font-size:54px;line-height:1;filter:drop-shadow(0 4px 8px #0003)}
.hero .rank{font-family:Fredoka;font-size:22px;font-weight:600}
.hero small{opacity:.9;font-weight:700}
.xpbar{height:10px;background:#ffffff40;border-radius:9px;margin-top:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .6s}
.pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{background:#ffffff2e;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:800}
.section{margin:22px 0 10px;font-family:Fredoka;font-size:18px;font-weight:600}
.areas{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;gap:9px}
.area{display:grid;grid-template-columns:130px 1fr 34px;align-items:center;gap:10px;font-size:14px;font-weight:700}
.area .bar{height:10px;background:#f1ecfb;border-radius:9px;overflow:hidden}
.area .bar i{display:block;height:100%;border-radius:9px}
.area span:last-child{color:var(--muted);text-align:right;font-size:13px}
.cards{display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center;text-align:left;width:100%;transition:transform .12s,box-shadow .12s;position:relative}
.card:active{transform:scale(.98)}
.card:hover{box-shadow:0 8px 22px -14px #7c4dff88}
.card .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;flex:none}
.card h3{font-size:18px;font-weight:600}
.card p{margin:3px 0 0;font-size:13.5px;color:var(--muted);line-height:1.35}
.card .lv{margin-left:auto;flex:none;font-weight:800;font-size:12px;background:#f3eeff;color:var(--pri);padding:5px 9px;border-radius:99px}
.card.daily{border:2px solid #ffb84d;background:linear-gradient(#fff,#fff8ec)}
.badge{position:absolute;top:-10px;left:14px;background:#ffb84d;color:#4a2b00;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px}
.family{margin-top:22px;font-size:13.5px;color:var(--muted);background:#ffffffaa;border:1px dashed #d8ccf5;border-radius:16px;padding:12px 14px;line-height:1.45}
.family summary{cursor:pointer;font-weight:800;color:var(--ink)}

/* game */
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ghead h2{font-size:20px;font-weight:600;flex:1}
.score{font-family:Fredoka;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:16px}
.timer{height:10px;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffb84d,#ff6b8b);transition:width .1s linear}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}
.info{text-align:center;font-weight:800;color:var(--muted);min-height:24px;margin-bottom:12px}
.intro{text-align:center}
.intro .big{font-size:60px}
.intro p{color:var(--muted);line-height:1.5;font-size:15.5px}
.btn{background:var(--pri);color:#fff;font-weight:800;font-size:17px;padding:14px 22px;border-radius:16px;box-shadow:0 6px 0 #5a2fd6;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #5a2fd6}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.btn.wide{width:100%}
/* memory */
.grid{display:grid;gap:10px;max-width:340px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:16px;background:#f1ecfb;border:2px solid #e3d9fa;transition:background .12s,transform .12s}
.cell.on{background:#8b5cf6;border-color:#6d3fe0;transform:scale(1.05)}
.cell.hit{background:#5fd497;border-color:#2fb36f}
.cell.miss{background:#ff8a8d;border-color:var(--bad)}
.cell.hint{background:#ffd27a;border-color:#e69500}
.lives{text-align:center;margin-top:14px;font-size:22px;letter-spacing:4px}
/* calc */
.problem{font-family:Fredoka;font-size:44px;text-align:center;font-weight:600;margin:6px 0}
.answer{font-family:Fredoka;font-size:36px;text-align:center;min-height:56px;border-radius:14px;background:#f7f4ff;margin:8px auto 14px;max-width:240px;padding:6px;transition:background .2s}
.answer.ok{background:#d6f5e3}.answer.no{background:#ffe1e2}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:330px;margin:0 auto}
.key{background:#f3eeff;font-family:Fredoka;font-size:26px;font-weight:600;padding:14px 0;border-radius:14px;color:var(--ink)}
.key:active{background:#e4daff}
.key.ok{grid-column:span 3;background:var(--pri);color:#fff;font-size:22px}
/* stroop */
.rule{text-align:center;font-weight:800;padding:9px 12px;border-radius:12px;background:#f3eeff;margin-bottom:10px}
.rule.alt{background:#fff1d6;color:#8a5200}
.word{font-family:Fredoka;font-size:58px;font-weight:700;text-align:center;margin:18px 0 22px;letter-spacing:1px}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors button{padding:16px 0;border-radius:14px;color:#fff;font-weight:800;font-size:17px;text-shadow:0 1px 2px #0005}
.fb{text-align:center;font-weight:800;min-height:24px;margin-top:10px}
/* series */
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 18px}
.seq span{font-family:Fredoka;font-weight:600;font-size:24px;background:#eef8ff;border:2px solid #cfeaff;border-radius:12px;padding:8px 12px;min-width:52px;text-align:center}
.seq span.q{background:#fff6e0;border-color:#ffd27a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#f7f4ff;border:2px solid #e8e0fb;border-radius:14px;padding:14px 10px;font-weight:800;font-size:20px;color:var(--ink);font-family:Fredoka}
.opt.good{background:#d6f5e3;border-color:#2fb36f}
.opt.badc{background:#ffe1e2;border-color:var(--bad)}
.explain{margin-top:14px;padding:12px 14px;border-radius:14px;background:#f0faff;border:1px solid #cfeaff;line-height:1.45;font-size:15px}
/* vida */
.mtag{font-size:12.5px;font-weight:800;color:#0f8a63;background:#dcf7ec;display:inline-block;padding:4px 10px;border-radius:99px}
.mtitle{font-size:22px;margin:10px 0 6px;font-weight:600}
.situ{line-height:1.5;font-size:16px;margin:0 0 6px}
.mq{font-weight:800;margin:12px 0}
.vopts{display:grid;gap:9px}
.vopt{text-align:left;background:#f7f4ff;border:2px solid #e8e0fb;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4;color:var(--ink);font-weight:600}
.vopt.p3{background:#d6f5e3;border-color:#2fb36f}
.vopt.p1{background:#fff4dc;border-color:#f0b43c}
.vopt.p0{background:#ffe1e2;border-color:var(--bad)}
.vopt:disabled{cursor:default}
.vfb{margin-top:14px;padding:13px 14px;border-radius:14px;background:#f7f4ff;line-height:1.45;font-size:15px}
.tool{margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff8e6;border:1px solid #ffe0a3;font-size:15px;line-height:1.45}
/* result */
.result{text-align:center}
.result .big{font-size:70px;margin-top:6px}
.result h2{font-size:28px;margin:6px 0}
.stats{display:grid;gap:8px;margin:16px 0;text-align:left}
.stats div{background:#f7f4ff;border-radius:12px;padding:10px 14px;font-weight:700}
.lvchange{font-family:Fredoka;font-size:19px;font-weight:600;padding:12px;border-radius:14px;margin:10px 0}
.up{background:#d6f5e3;color:#11673a}.same{background:#f3eeff;color:#5a2fd6}.down{background:#fff1d6;color:#8a5200}
.row{display:flex;gap:10px;margin-top:16px}.row .btn{flex:1}
/* modal */
.modal{position:fixed;inset:0;background:#2a214066;display:grid;place-items:center;padding:20px;z-index:10}
.modal .panel{max-width:400px;width:100%}
input[type=text]{width:100%;font-family:Fredoka;font-size:22px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);outline:none;margin:14px 0}
input[type=text]:focus{border-color:var(--pri)}
/* amig@s */
.lead{color:var(--muted);line-height:1.5;font-size:15px;margin:0 0 6px}
.lab{font-weight:800;margin:16px 0 8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#f3eeff;border:2px solid transparent;border-radius:99px;padding:8px 13px;font-weight:800;font-size:14px;color:var(--ink)}
.chip.sel{background:#fff;border-color:var(--pri);color:var(--pri)}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prow input[type=text]{margin:0;font-size:18px;padding:10px 12px;flex:1}
.turn{background:#fff1d6;color:#6b3e00;border-radius:14px;padding:10px 12px;font-size:17px;margin-bottom:6px}
.code{font-family:Fredoka;font-weight:600;font-size:22px;letter-spacing:1px;background:#f3eeff;border:2px dashed #c9b6ff;border-radius:14px;padding:12px;margin:10px 0;word-break:break-all;color:var(--pri)}
.msg{width:100%;min-height:120px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--ink);resize:none;background:#fbfaff}
.row a.btn{display:flex;align-items:center;justify-content:center}
.vs{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.vs div{background:#f7f4ff;border-radius:16px;padding:10px 18px;min-width:110px}
.vs small{display:block;color:var(--muted);font-weight:800}
.vs b{font-family:Fredoka;font-size:32px}
.vs span{font-family:Fredoka;font-weight:600;color:var(--muted)}
.ranking{display:grid;gap:8px;margin-top:12px;text-align:left}
.ranking div{display:flex;align-items:center;gap:12px;background:#f7f4ff;border-radius:14px;padding:10px 14px}
.ranking span{font-size:24px;width:34px;text-align:center;font-weight:800}
.ranking b{flex:1;font-size:17px}
.ranking em{font-style:normal;font-weight:800;color:var(--muted)}
.ranking small{font-weight:800;color:var(--ok);background:#d6f5e3;border-radius:99px;padding:2px 8px}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:14.5px}
.tbl th{font-size:12px;color:var(--muted);text-align:center;padding:6px 4px}
.tbl td{text-align:center;padding:9px 4px;border-top:1px solid var(--line)}
.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}
.tbl tr.meRow td{background:#f3eeff}
.hist{display:grid;gap:8px}
.hist>div{display:flex;align-items:center;gap:10px;background:#f7f4ff;border-radius:14px;padding:9px 12px}
.hist>div>span{font-size:20px}
.hist>div>div{flex:1}
.hist small{display:block;color:var(--muted);font-size:12.5px;font-weight:700}
.hist em{font-style:normal;font-family:Fredoka;font-weight:600;font-size:17px}
.status{font-size:13.5px;line-height:1.45;background:#f7f4ff;border-radius:12px;padding:10px 12px;color:var(--muted);font-weight:700}
.warn{display:block;width:100%;text-align:left;margin-top:14px;background:#fff1d6;color:#7a4500;border:1px solid #ffd27a;border-radius:16px;padding:12px 14px;font-weight:800;font-size:14px;line-height:1.4}
/* música */
.hero2{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 12px 30px -16px #7c4dff88}
.stagewrap{position:relative;line-height:0}
.stage{width:100%;height:auto;display:block;aspect-ratio:340/210}
.where{position:absolute;left:10px;top:10px;line-height:1.2;background:#000a;color:#fff;font-weight:800;font-size:12.5px;padding:4px 10px;border-radius:99px}
.hinfo{padding:12px 16px 16px;background:linear-gradient(180deg,#fff, #faf7ff)}
.sname{font-family:Fredoka;font-weight:700;font-size:26px;line-height:1.1}
.hinfo>small{color:var(--muted);font-weight:700}
.hinfo .xpbar{background:#efe9fb;margin:10px 0 4px}
.hinfo .xpbar i{background:linear-gradient(90deg,var(--gc),#ffb84d)}
.hinfo .pill{background:#f3eeff;color:var(--ink)}
.hbtns{display:flex;gap:8px;margin-top:12px}
.hbtns button{flex:1;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 6px;font-weight:800;font-size:14px;color:var(--ink)}
.band{display:grid;grid-template-columns:44px 1fr 40px;gap:12px;align-items:center}
.band .bi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.band .bt b{font-size:15px}.band .bt small{color:var(--muted);font-weight:700;font-size:12.5px}
.band .bar{height:9px;background:#f1ecfb;border-radius:9px;overflow:hidden;margin:4px 0 2px}.band .bar i{display:block;height:100%;border-radius:9px}
.blv{color:var(--muted);font-weight:800;font-size:13px;text-align:right}
.prev{position:sticky;top:6px;z-index:3;width:150px;margin:4px auto 0;background:radial-gradient(circle at 50% 40%,#f3eeff,#fff 72%);border-radius:50%;box-shadow:0 8px 24px -10px #7c4dff66;border:3px solid #fff}
.prev svg{width:100%;height:auto;display:block}
.sw{display:flex;flex-wrap:wrap;gap:9px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ddd5ef;font-size:14px;padding:0}
.sw button.sel{box-shadow:0 0 0 3px var(--pri)}
.sw button.lock,.chip.lock{opacity:.55}
.discos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.disco{background:#f5f3f9;border-radius:16px;padding:12px;text-align:center;filter:grayscale(1);opacity:.6}
.disco.got{filter:none;opacity:1;background:linear-gradient(160deg,#fff7d6,#ffe9f3)}
.disco .dv{font-size:36px}.disco b{display:block;font-size:14px;margin-top:4px}.disco small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:3px}.disco em{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:#b07a00;margin-top:4px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-14px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(760deg)}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:#2a2140;color:#fff;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.4;box-shadow:0 10px 30px #0004;max-width:92vw;animation:tin .35s ease}
.toast small{opacity:.85}
.toast.out{opacity:0;transition:opacity .35s}
@keyframes tin{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.qtag{display:inline-block;font-size:12.5px;font-weight:800;color:#4338ca;background:#e8e9ff;padding:4px 10px;border-radius:99px}
.qtext{font-family:Fredoka;font-weight:600;font-size:21px;line-height:1.3;margin:10px 0 14px}
.chest{font-size:80px;animation:wobble .5s ease-in-out infinite}
.chestOpen{font-size:80px;animation:pop .4s ease}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.05)}}
.chestpill{border:none;background:#ffb020 !important;color:#3b2500 !important;font-family:inherit;cursor:pointer;animation:wobble 1.2s ease-in-out infinite}
.skipq{display:block;margin:12px auto 0;background:none;border:none;color:var(--muted);font-weight:800;font-size:14px;text-decoration:underline;cursor:pointer}
.hist>div>.chip{flex:none;font-size:12.5px;padding:6px 10px}
.avs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 14px}
.avs>div{width:72px;text-align:center}.avs svg{width:72px;height:auto;background:#f3eeff;border-radius:50%}
.avs small{display:block;font-weight:800;font-size:11.5px;line-height:1.2;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gch{background:#f7f4ff;border-radius:16px;padding:12px;margin-bottom:10px}.gch.pend{background:#fff4e0;border:2px solid #ffc861}
.gchh{display:flex;align-items:center;gap:10px}.gchh>div{flex:1}.gchh small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.ic2{font-size:26px}.gres{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gres span{background:#fff;border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px}.gres span.me{background:#e9e0ff}.gres em{font-style:normal;color:var(--muted)}
.simon{display:grid;gap:12px;max-width:330px;margin:4px auto 0}
.pad{aspect-ratio:1;border-radius:22px;background:var(--c);opacity:.45;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:opacity .1s,transform .1s,box-shadow .1s;display:grid;place-items:center}
.pad span{font-size:30px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.25)}
.pad.on{opacity:1;transform:scale(1.06);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 35%,transparent),0 0 30px var(--c)}
.pad.bad{opacity:1;background:#333;animation:shake .3s}.pad.hint{opacity:1;outline:5px dashed #ffbf1f;outline-offset:3px}
.simbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;font-weight:800;color:var(--muted)}
.pairs{display:grid;gap:8px;max-width:380px;margin:0 auto}
.mcard{aspect-ratio:3/4;border-radius:14px;position:relative;background:none;padding:0;perspective:600px}
.mcard span{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;transition:transform .35s}
.mcard .back{background:linear-gradient(135deg,#7c4dff,#ff6b8b);color:#fff;font-family:Fredoka;font-size:26px;font-weight:700}
.mcard .front{background:#fff;border:2px solid var(--line);font-size:30px;transform:rotateY(180deg)}
.mcard.up .back{transform:rotateY(180deg)}.mcard.up .front{transform:rotateY(360deg)}
.mcard.done .front{background:#d6f5e3;border-color:#2fb36f}
.gsub{text-align:center;color:var(--muted);font-weight:800;font-size:13px;margin:-4px 0 10px}
.gtabs{margin-bottom:12px}.gtabs .chip{font-size:13px;padding:7px 11px}
.gnews{background:#fff7e6;border:1px solid #ffe0a3;border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.5;margin-bottom:12px}
.ggames{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gg{background:#f7f4ff;border:2px solid #e8e0fb;border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.gg.done{background:#eefaf3;border-color:#bfe9cf}.gg .ggi{font-size:26px}.gg b{font-size:14.5px}.gg small{font-weight:800;font-size:12.5px;color:var(--pri)}.gg.done small{color:var(--ok)}.gg .gl{color:var(--muted)!important;font-weight:700}
.ranking div.meR{background:#e9e0ff}
.mcardm{display:flex;gap:10px;background:#f7f4ff;border-radius:16px;padding:10px;margin-bottom:9px}.mcardm.me{background:#efe7ff;border:2px solid #d4c3ff}
.mav{width:64px;flex:none}.mav svg{width:64px;height:auto;background:#fff;border-radius:50%}
.mi{flex:1;min-width:0}.mi b{display:block}.mi small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.mlv{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:6px}.mlv span{display:grid;grid-template-columns:18px 1fr 16px;align-items:center;gap:4px;font-size:13px}
.mlv span::before{content:'';grid-column:2;grid-row:1;height:6px;border-radius:6px;background:#e7e0f7}.mlv i{grid-column:2;grid-row:1;height:6px;border-radius:6px;display:block}
.mlv em{font-style:normal;font-weight:800;color:var(--muted);font-size:11.5px}

@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:420px){.area{grid-template-columns:110px 1fr 30px}.word{font-size:46px}.problem{font-size:38px}}
</style>
</head>
<body>
<div class="app" id="view"></div>
<div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s);
const view=$('#view');
// Azar con semilla: así una amiga puede jugar exactamente la misma partida
let rnd=Math.random;
const seeded=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const r=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const newSeed=()=>1+Math.floor(Math.random()*2147483000);
const APP_URL=/github\.io$/.test(location.hostname)?location.origin+location.pathname.replace(/index\.html$/,''):'https://claude.ai/artifact/K4jx1qV4b2Tb9bttzFFZMA';
const CODES={mem:'M',calc:'C',stroop:'T',series:'S',vida:'V',trivia:'Q',musica:'X'};
const DIFF=[['Fácil',2],['Medio',5],['Difícil',8]];
let ctx={mode:'solo',lv:1,seed:1};
let pending=null; // reto recibido por enlace
function launch(k,o={}){
 cleanup();curView='game';$('#modalRoot').innerHTML='';
 const seed=o.seed||newSeed();
 ctx=Object.assign({k,mode:'solo',lv:st.games[k].lv},o,{seed});
 rnd=seeded(seed);PLAY[k]();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const GAMES={
 mem:{name:'Memoria musical',icon:'🧠',area:'Memoria',col:'#8b5cf6',bg:'#f1ebff',desc:'Simón musical de colores y sonidos, o el clásico juego de parejas.'},
 calc:{name:'Cálculo veloz',icon:'⚡',area:'Agilidad mental',col:'#f59e0b',bg:'#fff4dc',desc:'Resuelve todas las operaciones que puedas en 60 segundos.'},
 stroop:{name:'Colores trampa',icon:'🎨',area:'Atención',col:'#ec4899',bg:'#ffe6f1',desc:'Pulsa el color de la tinta, no lo que pone. ¡Tu cerebro intentará engañarte!'},
 series:{name:'Series ocultas',icon:'🔎',area:'Lógica',col:'#0ea5e9',bg:'#e3f5ff',desc:'Descubre la regla secreta y encuentra el número que falta.'},
 trivia:{name:'Trivial de clase',icon:'📚',area:'Cultura de clase',col:'#6366f1',bg:'#e8e9ff',desc:'Preguntas del temario de 2º de ESO: mates, ciencias, sociales, lenguas, inglés y tecnología.'},
 musica:{name:'Trivial musical',icon:'🎵',area:'Cultura musical',col:'#ff4fa0',bg:'#ffe3f0',desc:'Cantantes, canciones, instrumentos y la música que das en clase.'},
 vida:{name:'Misiones de vida',icon:'🧭',area:'Resolver problemas',col:'#10b981',bg:'#dcf7ec',desc:'Situaciones reales: ¿cuál es la mejor manera de resolverlas?'}
};
const RANKS=[[0,'Tu habitación','🛏️'],[150,'El garaje','🚪'],[400,'Café del barrio','☕'],[800,'Sala de conciertos','🎟️'],[1400,'Festival','🎪'],[2200,'Estadio','🏟️'],[3200,'Gira mundial','🌍'],[4500,'Leyenda','🌟']];

/* ---------- estado ---------- */
const KEY='gimnasio-mental-v1';
function def(){return{name:'',xp:0,streak:0,lastDay:'',daily:null,vidaSeen:[],duels:[],league:{},games:Object.fromEntries(Object.keys(GAMES).map(k=>[k,{lv:1,best:0,plays:0}]))}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.games){const d=def();for(const k in d.games)if(!s.games[k])s.games[k]=d.games[k];return Object.assign(d,s)}}catch(e){}return def()}
let localOK=false;try{localStorage.setItem(KEY+'-t','1');localOK=localStorage.getItem(KEY+'-t')==='1'}catch(e){}
function norm(s){s.stats=Object.assign({plays:0,daily:0,records:0,perfect:0,group:0,early:0,sent:0},s.stats||{});if(!s.stats.plays)s.stats.plays=Object.values(s.games).reduce((a,g)=>a+(g.plays||0),0);s.discos=s.discos||{};if(s.sound===undefined)s.sound=true;return s}
let st=norm(load());
if(st.name&&!st.profile){st.profile={curso:'2eso'}}
/* --- guardado: navegador + nube de la cuenta (si hay sesión iniciada en Claude) --- */
let cloudRef=null,cloudBusy=false,cloudDirty=false,cloudTimer=null,curView='';
function save(){
 st.savedAt=Date.now();
 try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
 if(cloudRef){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudPush,1200)}
}
async function cloudPush(){
 if(!cloudRef)return;
 if(cloudBusy){cloudDirty=true;return}
 cloudBusy=true;
 try{await cloudRef.set({st:JSON.parse(JSON.stringify(st))})}
 catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'))cloudRef=null}
 cloudBusy=false;
 if(cloudDirty){cloudDirty=false;cloudPush()}
}
function mergeState(remote,local){
 const d=def(),m=Object.assign(d,remote);
 for(const k in d.games)if(!m.games[k])m.games[k]=def().games[k];
 // une los retos de los dos lados para no perder ninguno
 const seen=new Set((m.duels||[]).map(x=>x.seed+'|'+x.rival.toLowerCase()));
 (local.duels||[]).forEach(x=>{if(!seen.has(x.seed+'|'+x.rival.toLowerCase()))m.duels.push(x)});
 m.duels.sort((a,b)=>a.date<b.date?1:-1);
 return norm(m);
}
function refreshView(){
 if(curView==='name'&&st.name){if(!openPending())home()}
 else if(curView==='home')home();
 else if(curView==='rank')myRanking();
}
async function initCloud(){
 try{
  const C=window.claude;if(!C||!C.use)return;
  const [db,user]=await Promise.all([C.use('db'),C.use('user')]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/estado');
  const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
  cloudRef=ref;
  const remote=snap.exists&&snap.data()&&snap.data().st;
  if(remote&&remote.games&&(remote.savedAt||0)>(st.savedAt||0)){
   st=mergeState(remote,st);try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
   refreshView();
  }else if(st.name){cloudPush()}
  if(curView==='home')home();
 }catch(e){cloudRef=null}
}
const storageStatus=()=>cloudRef?['☁️','Tu progreso se guarda en tu cuenta de Claude (en la nube).']:localOK?['💾','Tu progreso se guarda en este navegador. Si borras los datos del navegador o juegas desde otro sitio, se pierde: haz copias de seguridad.']:['⚠️','Este navegador no está guardando el progreso. Haz una copia de seguridad al terminar de jugar.'];
const toCode=o=>'GM1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
function fromCode(c){c=String(c).trim();if(!c.startsWith('GM1:'))return null;try{const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));return o&&o.games?o:null}catch(e){return null}}
const dayStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dayStr(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dayStr(d)};
function rankOf(xp){let i=0;RANKS.forEach((x,j)=>{if(xp>=x[0])i=j});return i}
function daily(){
 if(!st.daily||st.daily.day!==today()){
  const ks=Object.keys(GAMES).sort((a,b)=>st.games[a].lv-st.games[b].lv||st.games[a].plays-st.games[b].plays||Math.random()-.5);
  st.daily={day:today(),game:ks[0],done:false};save();
 }
 return st.daily;
}

/* ---------- utilidades de partida ---------- */
let timers=[],intv=null,keyH=null;
const later=(f,ms)=>{const t=setTimeout(f,ms);timers.push(t);return t};
function cleanup(){timers.forEach(clearTimeout);timers=[];if(intv)clearInterval(intv);intv=null;if(keyH)document.removeEventListener('keydown',keyH);keyH=null}
function frame(k,timer){
 const g=GAMES[k];
 view.innerHTML=`<div class="ghead"><button class="iconbtn" id="exit" title="Salir">✕</button><h2>${g.icon} ${g.name} <span style="font-size:14px;color:var(--muted)">· ${ctx.mode==='group'?esc(ctx.player):ctx.mode==='solo'?'nivel '+ctx.lv:ctx.gname?'👥 '+esc(ctx.gname):'⚔️ reto'}</span></h2><div class="score" id="score">0</div></div>${timer?'<div class="timer"><i id="tbar"></i></div>':''}<div class="panel pop" id="body"></div>`;
 $('#exit').onclick=()=>{cleanup();home()};
 return $('#body');
}
const setScore=v=>{const e=$('#score');if(e)e.textContent=v};
function intro(k,extra,start){
 const b=frame(k,false);const g=GAMES[k];
 b.innerHTML=`<div class="intro">${ctx.banner?`<div class="turn">${ctx.banner}</div>`:''}<div class="big">${g.icon}</div><h2 class="f" style="margin-top:6px">${g.name}</h2><p>${g.desc}${extra?'<br><br>'+extra:''}</p><button class="btn" id="go">¡Empezar!</button></div>`;
 $('#go').onclick=start;
}
function startTimer(sec,onEnd){
 const t0=Date.now(),tot=sec*1000;
 intv=setInterval(()=>{const left=tot-(Date.now()-t0);const b=$('#tbar');if(b)b.style.width=Math.max(0,left/tot*100)+'%';if(left<=0){clearInterval(intv);intv=null;onEnd()}},100);
}

/* ---------- final de partida ---------- */
function addStreak(){if(st.lastDay!==today()){st.streak=st.lastDay===yesterday()?st.streak+1:1;st.lastDay=today()}}
function finish(k,score,delta,lines,cheer,perfect){
 cleanup();
 const r0=rankOf(st.xp);
 st.stats.plays++;if(new Date().getHours()<9&&new Date().getHours()>=5)st.stats.early++;
 if(ctx.mode==='group'){save();return groupDone(score)}
 if(perfect)st.stats.perfect++;
 if(ctx.mode==='gday'){st.xp+=Math.max(5,Math.round(score/4));addStreak();save();return groupDayDone(k,score,r0)}
 if(ctx.mode==='gnew'||ctx.mode==='gplay'){st.xp+=Math.max(5,Math.round(score/4));addStreak();save();return groupChDone(k,score,r0)}
 if(ctx.mode==='challenge')return challengeDone(k,score,cheer,r0);
 if(ctx.mode==='send'){st.xp+=Math.max(5,Math.round(score/4));st.stats.sent++;addStreak();save();shareScreen(k,ctx.lv,ctx.seed,score);return celebrate(r0,false,false)}
 const g=st.games[k],old=g.lv,oldRank=r0;
 g.lv=Math.max(1,Math.min(10,g.lv+delta));g.plays++;
 const record=score>g.best&&g.plays>1;if(score>g.best)g.best=score;if(record)st.stats.records++;
 let xp=Math.max(5,Math.round(score/4));
 const d=daily();let bonus=0;
 if(d.game===k&&!d.done){bonus=Math.round(xp*.5)+10;d.done=true;st.stats.daily++}
 st.xp+=xp+bonus;addStreak();
 save();
 const newRank=rankOf(st.xp);
 const lvTxt=g.lv>old?`<div class="lvchange up">⬆️ ¡Subes al nivel ${g.lv}! Ahora será un poco más difícil.</div>`:g.lv<old?`<div class="lvchange down">Bajamos al nivel ${g.lv} para afianzar. ¡Así se aprende! 💪</div>`:`<div class="lvchange same">Sigues en el nivel ${g.lv}. ¡Un poco más y subes!</div>`;
 const b=frame(k,false);setScore(score);
 b.innerHTML=`<div class="result"><div class="big">${cheer[0]}</div><h2 class="f">${cheer[1]}</h2><div style="color:var(--muted);font-weight:700">${score} puntos${record?' · 🏆 ¡Nuevo récord!':''}</div>
 ${lvTxt}
 <div class="stats">${lines.map(l=>`<div>${l}</div>`).join('')}<div>🙌 +${xp} fans${bonus?` &nbsp;·&nbsp; 🎯 Reto del día: +${bonus} fans extra`:''}</div>${perfect?'<div style="background:#fff1d6">🎯 ¡Actuación perfecta, sin fallos!</div>':''}${newRank>oldRank?`<div style="background:#fff1d6">${RANKS[newRank][2]} ¡Nuevo escenario: <b>${RANKS[newRank][1]}</b>!</div>`:''}</div>
 ${bonus&&st.chestDay!==today()?'<button class="btn wide" id="chestBtn" style="background:#ffb020;box-shadow:0 6px 0 #c77f00;margin-bottom:12px">🎁 ¡Abrir el cofre del día!</button>':''}
 <button class="btn wide" id="dare" style="background:#ff6b8b;box-shadow:0 6px 0 #d84467;margin-top:6px">⚔️ Retar a alguien con esta partida</button>
 <div class="row"><button class="btn ghost" id="home">Inicio</button><button class="btn" id="again">Otra vez</button></div></div>`;
 const seed=ctx.seed,lv=ctx.lv;
 $('#home').onclick=home;$('#again').onclick=()=>launch(k);if($('#chestBtn'))$('#chestBtn').onclick=openChest;$('#dare').onclick=()=>shareScreen(k,lv,seed,score);
 celebrate(r0,g.lv>old,false);
}
const cheerFor=p=>p>=.8?['🤩','¡Increíble!']:p>=.55?['😎','¡Muy bien!']:p>=.3?['🙂','¡Buen entrenamiento!']:['💪','¡Cada intento cuenta!'];

/* ================= 1. MEMORIA ================= */
/* ---- sonido de notas ---- */
function playNote(midi,dur=0.35,wave='triangle',vol=0.16){
 const c=audio();if(!c)return;const t=c.currentTime+0.01,o=c.createOscillator(),g=c.createGain();
 o.type=wave;o.frequency.value=440*Math.pow(2,(midi-69)/12);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);
}
const buzz=()=>{playNote(45,0.35,'square',0.06);setTimeout(()=>playNote(42,0.4,'square',0.05),120)};
const PADS=[['#ff4d6d','●',60],['#4f7cff','▲',62],['#22c55e','■',64],['#ffbf1f','★',67],['#9b5cff','♥',69],['#ff8a3d','◆',72],['#14b8a6','✿',74],['#ec4899','☀',76],['#64748b','♪',79]];

function playMem(){
 const lv=ctx.lv,solo=ctx.mode==='solo';
 let mode=solo?(st.memMode||'simon'):'simon';
 const extra=solo?`<div class="chips" id="mm" style="justify-content:center;margin-top:6px"><button class="chip${mode==='simon'?' sel':''}" data-v="simon">🎵 Simón musical</button><button class="chip${mode==='pares'?' sel':''}" data-v="pares">🃏 Parejas</button></div><div id="mmd" class="lead" style="margin-top:10px"></div>`:'🎵 Simón musical: repite la secuencia de colores y sonidos. ¡Cada ronda se añade una nota más!';
 const desc=m=>m==='simon'?'Mira y escucha la secuencia de colores y repítela. <b>Cada ronda se añade una nota más.</b> Tienes 2 vidas y puedes pulsar «👀 Ver otra vez» una vez en cada ronda.':'Da la vuelta a las cartas de dos en dos y encuentra todas las parejas <b>con los menos movimientos posibles</b>.';
 intro('mem',extra,()=>{if(solo){st.memMode=mode;save()}mode==='pares'?memPairs(lv):memSimon(lv)});
 if(solo){$('#mmd').innerHTML=desc(mode);bindChips('mm',v=>{mode=v;$('#mmd').innerHTML=desc(v)})}
}
function memSimon(lv){
 const n=lv<=3?4:lv<=6?6:9,cols=n===9?3:n===6?3:2,startLen=lv<=3?1:lv<=6?2:3,target=5+lv,sp=Math.max(320,650-lv*30);
 const S={seq:[],idx:0,lives:2,score:0,accept:false,best:0,replay:true,lost:false};
 const b=frame('mem',false);
 b.innerHTML=`<div class="info" id="mi"></div><div class="simon" style="grid-template-columns:repeat(${cols},1fr)">${PADS.slice(0,n).map((p,i)=>`<button class="pad" data-i="${i}" style="--c:${p[0]}"><span>${p[1]}</span></button>`).join('')}</div>
  <div class="simbar"><span id="lv"></span><button class="chip" id="again">👀 Ver otra vez</button><span id="len"></span></div>`;
 const pads=[...b.querySelectorAll('.pad')],info=t=>$('#mi').textContent=t;
 const lives=()=>{$('#lv').textContent='❤️'.repeat(S.lives)+'🤍'.repeat(2-S.lives);$('#len').textContent=`🎵 ${S.seq.length} notas`};
 const light=(i,ms)=>{const p=pads[i];p.classList.add('on');playNote(PADS[i][2],ms/1000+0.1);later(()=>p.classList.remove('on'),ms)};
 function show(){
  S.accept=false;S.idx=0;info('👂 Mira y escucha…');lives();$('#again').disabled=true;let i=0;
  const step=()=>{if(i>=S.seq.length){S.accept=true;info('¡Tu turno! 👆');$('#again').disabled=!S.replay;return}light(S.seq[i],sp);i++;later(step,sp+160)};
  later(step,700);
 }
 function nextRound(){
  if(!S.seq.length)for(let k=0;k<startLen;k++)S.seq.push(r(0,n-1));else S.seq.push(r(0,n-1));
  S.replay=true;if(S.seq.length>20)return done();show();
 }
 $('#again').onclick=()=>{if(!S.accept||!S.replay)return;S.replay=false;S.score=Math.max(0,S.score-5);setScore(S.score);show()};
 pads.forEach((p,i)=>p.onclick=()=>{
  if(!S.accept)return;
  if(i===S.seq[S.idx]){light(i,220);S.idx++;
   if(S.idx===S.seq.length){S.accept=false;S.best=Math.max(S.best,S.seq.length);S.score+=S.seq.length*10;setScore(S.score);info(['¡Bien! 🎉','¡Genial! ✨','¡Sigue así! 🔥'][S.seq.length%3]);later(nextRound,900)}}
  else{S.accept=false;S.lost=true;p.classList.add('bad');buzz();later(()=>p.classList.remove('bad'),500);
   const ok=S.seq[S.idx];pads[ok].classList.add('hint');later(()=>pads[ok].classList.remove('hint'),900);
   S.lives--;lives();if(S.lives<=0){info('¡Se acabó! 🎤');later(done,1200)}else{info('¡Uy! Era la marcada. La repetimos…');later(show,1400)}}
 });
 lives();nextRound();
 function done(){finish('mem',S.score,S.best>=target?1:S.best<target-4?-1:0,[`🎵 Secuencia más larga: ${S.best} notas`,`🎯 Objetivo de tu nivel: ${target} notas`],cheerFor(Math.min(1,S.best/target)),!S.lost&&S.best>=target)}
}
function memPairs(lv){
 const P=lv<=2?6:lv<=5?8:10,cols=P===10?5:4;
 const SYM=['🎸','🥁','🎹','🎺','🎻','🎷','🎤','🎧','💿','⭐','🌈','🦄','🍕','🐱','⚡','🌸'];
 const syms=shuffle(SYM).slice(0,P),deck=shuffle([...syms,...syms]);
 const S={open:[],moves:0,found:0,lock:false,t0:Date.now()};
 const b=frame('mem',false);
 b.innerHTML=`<div class="info" id="mi">Encuentra las ${P} parejas</div><div class="pairs" style="grid-template-columns:repeat(${cols},1fr)">${deck.map((s,i)=>`<button class="mcard" data-i="${i}"><span class="back">?</span><span class="front">${s}</span></button>`).join('')}</div><div class="simbar"><span id="mv">Movimientos: 0</span><span id="fd">Parejas: 0/${P}</span></div>`;
 const cards=[...b.querySelectorAll('.mcard')];
 cards.forEach((c,i)=>c.onclick=()=>{
  if(S.lock||c.classList.contains('up'))return;
  c.classList.add('up');playNote(60+SYM.indexOf(deck[i])%12,0.25,'sine',0.14);S.open.push(i);
  if(S.open.length===2){S.moves++;$('#mv').textContent='Movimientos: '+S.moves;const [a,bb]=S.open;
   if(deck[a]===deck[bb]){S.found++;S.open=[];$('#fd').textContent=`Parejas: ${S.found}/${P}`;later(()=>{playNote(72,0.15,'triangle');later(()=>playNote(79,0.25,'triangle'),110);cards[a].classList.add('done');cards[bb].classList.add('done')},200);
    if(S.found===P)later(done,900)}
   else{S.lock=true;later(()=>{cards[a].classList.remove('up');cards[bb].classList.remove('up');S.open=[];S.lock=false},850)}}
 });
 function done(){const secs=Math.round((Date.now()-S.t0)/1000),extra=S.moves-P,score=Math.max(10,P*30-extra*6+Math.max(0,90-secs));
  finish('mem',score,S.moves<=P*1.6?1:S.moves>P*2.6?-1:0,[`🃏 Movimientos: ${S.moves} (mínimo posible: ${P})`,`⏱️ Tiempo: ${secs} s`],cheerFor(Math.max(0,1-extra/(P*1.5))),S.moves<=Math.ceil(P*1.3))}
}
/* ================= 2. CÁLCULO ================= */
function calcProblem(lv){
 const ops=['+','-'];const max=10+lv*10;
 if(lv>=2)ops.push('×','×');if(lv>=4)ops.push('÷');if(lv>=6)ops.push('%');if(lv>=7)ops.push('mix');
 const op=pick(ops);let a,b,c;
 switch(op){
  case '+':a=r(1,max);b=r(1,max);return{q:`${a} + ${b}`,a:a+b};
  case '-':a=r(1,max);b=r(1,max);if(lv<5&&b>a)[a,b]=[b,a];return{q:`${a} − ${b}`,a:a-b};
  case '×':{const t=Math.min(12,4+lv);a=r(2,t);b=r(2,lv>=6?15:t);return{q:`${a} × ${b}`,a:a*b}}
  case '÷':b=r(2,Math.min(12,3+lv));c=r(2,10+lv);return{q:`${b*c} ÷ ${b}`,a:c};
  case '%':{const p=pick([10,20,25,50,75]),base=r(1,10)*20;return{q:`${p}% de ${base}`,a:base*p/100}}
  case 'mix':a=r(2,20);b=r(2,9);c=r(2,9);return{q:`${a} + ${b} × ${c}`,a:a+b*c};
 }
}
function playCalc(){
 const lv=ctx.lv;
 intro('calc',`Tienes 60 segundos. Escribe el resultado y pulsa OK (o Enter en el teclado).${lv>=7?' Recuerda: la multiplicación va antes que la suma.':''}`,()=>{
  const S={ok:0,bad:0,score:0,p:null,inp:'',over:false};
  const b=frame('calc',true);
  b.innerHTML=`<div class="problem" id="cq"></div><div class="answer" id="ca"></div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'±',0,'⌫'].map(k=>`<button class="key" data-k="${k}">${k}</button>`).join('')}<button class="key ok" data-k="OK">OK</button></div>`;
  const newP=()=>{S.p=calcProblem(lv);S.inp='';$('#cq').textContent=S.p.q+' = ?';showA()};
  const showA=()=>$('#ca').textContent=S.inp||' ';
  const mark=(cl,txt)=>{const e=$('#ca');e.className='answer '+cl;if(txt)e.textContent=txt;later(()=>{e.className='answer'},350)};
  function press(k){
   if(S.over)return;
   if(k==='⌫')S.inp=S.inp.slice(0,-1);
   else if(k==='±')S.inp=S.inp.startsWith('-')?S.inp.slice(1):'-'+S.inp;
   else if(k==='OK'){if(S.inp===''||S.inp==='-')return;
    if(Number(S.inp)===S.p.a){S.ok++;S.score+=10;setScore(S.score);mark('ok');newP();return}
    else{S.bad++;const sol=S.p.a;newP();mark('no','era '+sol);return}}
   else if(S.inp.replace('-','').length<6)S.inp+=k;
   showA();
  }
  b.querySelectorAll('.key').forEach(x=>x.onclick=()=>press(x.dataset.k));
  keyH=e=>{if(/^[0-9]$/.test(e.key))press(Number(e.key));else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter')press('OK');else if(e.key==='-')press('±')};
  document.addEventListener('keydown',keyH);
  newP();
  startTimer(60,()=>{S.over=true;const acc=S.ok/Math.max(1,S.ok+S.bad);
   finish('calc',S.score,(S.ok>=14&&acc>=.8)?1:S.ok<=5?-1:0,[`✅ Correctas: ${S.ok}`,`❌ Fallos: ${S.bad}`,`🎯 Precisión: ${Math.round(acc*100)}%`],cheerFor(Math.min(1,S.ok/16)),S.ok>=15&&S.bad===0)});
 });
}

function playStroop(){
 const lv=ctx.lv;
 let C=[{n:'ROJO',c:'#e53935'},{n:'AZUL',c:'#1e63e9'},{n:'VERDE',c:'#22994a'},{n:'AMARILLO',c:'#e0a400'}];
 if(lv>=6)C.push({n:'MORADO',c:'#8e3bd6'});
 const swap=lv>=4;
 intro('stroop',`Tienes 45 segundos. Fíjate en el <b>color de la tinta</b>.${swap?'<br>⚠️ <b>A veces cambiará la regla</b> y tendrás que pulsar lo que PONE la palabra. ¡Lee bien la instrucción!':''}`,()=>{
  const S={ok:0,bad:0,score:0,t:null,lock:false};
  const b=frame('stroop',true);
  b.innerHTML=`<div class="rule" id="sr"></div><div class="word" id="sw"></div><div class="colors" id="sc"></div><div class="fb" id="sf"></div>`;
  let order=C.slice();
  const drawBtns=()=>{$('#sc').innerHTML=order.map(x=>`<button style="background:${x.c}" data-n="${x.n}">${x.n}</button>`).join('');
   $('#sc').querySelectorAll('button').forEach(bt=>bt.onclick=()=>answer(bt.dataset.n))};
  function trial(){
   if(lv>=7){order=shuffle(C);drawBtns()}
   const w=pick(C);let ink=w;const cong=lv<3?.3:.15;
   if(rnd()>cong){do ink=pick(C);while(ink===w)}
   const mode=swap&&rnd()<.3?'word':'ink';
   S.t={ans:mode==='ink'?ink.n:w.n};
   const rl=$('#sr');rl.className='rule'+(mode==='word'?' alt':'');rl.textContent=mode==='ink'?'Pulsa el COLOR de la tinta':'¡Ojo! Pulsa lo que PONE la palabra';
   const sw=$('#sw');sw.textContent=w.n;sw.style.color=ink.c;sw.classList.remove('pop');void sw.offsetWidth;sw.classList.add('pop');
  }
  function answer(n){if(S.lock||!S.t)return;
   const f=$('#sf');
   if(n===S.t.ans){S.ok++;S.score+=10;f.textContent='✅';f.style.color='var(--ok)'}
   else{S.bad++;S.score=Math.max(0,S.score-5);f.textContent='❌ Era '+S.t.ans;f.style.color='var(--bad)';$('#sw').classList.add('shake')}
   setScore(S.score);trial();
  }
  drawBtns();trial();
  startTimer(45,()=>{S.lock=true;const acc=S.ok/Math.max(1,S.ok+S.bad);
   finish('stroop',S.score,(S.ok>=22&&acc>=.85)?1:(acc<.6||S.ok<8)?-1:0,[`✅ Aciertos: ${S.ok}`,`❌ Fallos: ${S.bad}`,`🎯 Precisión: ${Math.round(acc*100)}%`,'💡 Este juego entrena el control de impulsos: frenar la primera respuesta automática y pensar.'],cheerFor(Math.min(1,S.ok/24)*acc),S.ok>=15&&S.bad===0)});
 });
}

/* ================= 4. SERIES ================= */
const mk=(fn,rule,n=5)=>({seq:Array.from({length:n},(_,i)=>fn(i)),ans:fn(n),rule});
const SERIES=[
 {min:1,f(){const a=r(1,12),d=r(2,6);return mk(i=>a+d*i,`Cada número suma <b>${d}</b> al anterior.`)}},
 {min:1,f(){const a=r(40,90),d=r(3,8);return mk(i=>a-d*i,`Cada número resta <b>${d}</b> al anterior.`)}},
 {min:2,f(){const a=r(1,4),k=pick([2,3]);return mk(i=>a*k**i,`Cada número se <b>multiplica por ${k}</b>.`)}},
 {min:3,f(){const a=r(1,10),d=r(1,3);return mk(i=>a+i*d+i*(i-1)/2,`Las diferencias van creciendo: +${d}, +${d+1}, +${d+2}… <b>cada salto es uno más grande</b>.`)}},
 {min:3,f(){const a=r(5,20),x=r(3,8),y=r(1,x-1);const fn=i=>a+Math.ceil(i/2)*x-Math.floor(i/2)*y;return mk(fn,`Se alterna: <b>+${x}</b> y luego <b>−${y}</b>.`,6)}},
 {min:4,f(){const s=r(1,4);return mk(i=>(s+i)**2,`Son <b>números al cuadrado</b>: ${s}×${s}, ${s+1}×${s+1}, ${s+2}×${s+2}…`)}},
 {min:4,f(){const a=r(1,3),b=r(2,5);const s=[a,b];for(let i=2;i<7;i++)s.push(s[i-1]+s[i-2]);return{seq:s.slice(0,6),ans:s[6],rule:'Cada número es <b>la suma de los dos anteriores</b> (como la serie de Fibonacci).'}}},
 {min:5,f(){const a=r(1,9),d1=r(2,5),b=r(20,40),d2=r(2,5);const fn=i=>i%2===0?a+d1*(i/2):b-d2*((i-1)/2);return mk(fn,`Hay <b>dos series mezcladas</b>: en las posiciones impares se suma ${d1} y en las pares se resta ${d2}.`,7)}},
 {min:6,f(){const a=r(1,4);return mk(i=>{let v=a;for(let j=0;j<i;j++)v=v*2+1;return v},'Cada número se <b>multiplica por 2 y se le suma 1</b>.')}},
 {min:7,f(){const s=r(1,4);return mk(i=>(s+i)**2+1,'Son <b>cuadrados más 1</b>: n×n + 1.')}},
 {min:7,f(){const a=r(2,5);return mk(i=>{let v=a;for(let j=0;j<i;j++)v=j%2===0?v*2:v+3;return v},'Se alterna: <b>×2</b> y luego <b>+3</b>.',6)}},
];
function playSeries(){
 const lv=ctx.lv,N=8;
 intro('series',`Son ${N} retos. Busca la regla que siguen los números. Después de cada uno verás la explicación: <b>¡lo importante es entender la regla!</b>`,()=>{
  const S={q:0,ok:0,score:0,t0:0};
  const b=frame('series',false);
  const pool=SERIES.filter(s=>s.min<=lv);
  function q(){
   if(S.q>=N)return done();S.q++;
   const easy=pool.filter(s=>s.min<=Math.max(1,lv-2)),hard=pool.filter(s=>s.min>Math.max(1,lv-2));
   const p=(hard.length&&rnd()<.6?pick(hard):pick(easy.length?easy:pool)).f();
   const last=p.seq[p.seq.length-1],prev=p.seq[p.seq.length-2];
   const cand=new Set();cand.add(last+(last-prev));
   shuffle([1,-1,2,-2,3,-3,4,5,-5,10,-10]).forEach(o=>cand.add(p.ans+o));
   const ds=[...cand].filter(v=>v!==p.ans&&v>=0).slice(0,3);
   const opts=shuffle([p.ans,...ds]);
   b.innerHTML=`<div class="info">Reto ${S.q} de ${N}</div><div class="seq">${p.seq.map(v=>`<span>${v}</span>`).join('')}<span class="q">?</span></div><div class="opts">${opts.map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join('')}</div><div id="ex"></div>`;
   b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
   S.t0=Date.now();
   b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    b.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.v===p.ans)x.classList.add('good')});
    const good=+o.dataset.v===p.ans;
    if(good){S.ok++;const fast=Date.now()-S.t0<8000;S.score+=10+(fast?5:0);setScore(S.score)}else o.classList.add('badc');
    b.querySelector('.q').textContent=p.ans;
    $('#ex').innerHTML=`<div class="explain">${good?'✅ ¡Correcto!':'❌ Esta vez no.'} ${p.rule}</div><button class="btn wide" style="margin-top:14px" id="nx">${S.q>=N?'Ver resultado':'Siguiente →'}</button>`;
    $('#nx').onclick=q;
   });
  }
  q();
  function done(){finish('series',S.score,S.ok>=7?1:S.ok<=3?-1:0,[`✅ Aciertos: ${S.ok} de ${N}`,'⚡ Si respondes en menos de 8 segundos ganas puntos extra.'],cheerFor(S.ok/N),S.ok===N)}
 });
}

 intro('vida','Vas a ver 3 situaciones de la vida real. No hay prisa: <b>piensa antes de elegir</b>. Después verás por qué cada opción funciona mejor o peor y te llevarás una herramienta mental.',()=>{
  const solo=ctx.mode==='solo',seen=solo?(st.vidaSeen||[]):[];
  const pool=shuffle(MISSIONS.filter(m=>m.tier<=tier)).sort((a,b)=>(seen.includes(a.id)-seen.includes(b.id))||(b.tier===tier)-(a.tier===tier));
  const list=pool.slice(0,N);
  if(solo){st.vidaSeen=[...seen,...list.map(m=>m.id)].slice(-8);save()}
  const S={i:0,pts:0,score:0};
  const b=frame('vida',false);
  function show(){
   if(S.i>=N)return done();
   const m=list[S.i];S.i++;
   const opts=shuffle(m.o);
   b.innerHTML=`<span class="mtag">Misión ${S.i} de ${N}</span><h3 class="mtitle">${m.t}</h3><p class="situ">${m.s}</p><div class="mq">${m.q}</div><div class="vopts">${opts.map((o,j)=>`<button class="vopt" data-j="${j}">${o[0]}</button>`).join('')}</div><div id="vf"></div>`;
   b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
   b.querySelectorAll('.vopt').forEach(bt=>bt.onclick=()=>{
    const o=opts[+bt.dataset.j];S.pts+=o[1];S.score+=o[1]*10;setScore(S.score);
    b.querySelectorAll('.vopt').forEach(x=>{x.disabled=true;const oo=opts[+x.dataset.j];if(oo[1]===3)x.classList.add('p3')});
    if(o[1]<3)bt.classList.add(o[1]>0?'p1':'p0');
    const best=opts.find(x=>x[1]===3);
    $('#vf').innerHTML=`<div class="vfb">${o[1]===3?'🌟 <b>¡Muy buena elección!</b> ':o[1]>0?'🤔 <b>No está mal, pero se puede mejorar.</b> ':'🙈 <b>Mejor no.</b> '}${o[2]}${o[1]<3?`<br><br>👉 <b>La mejor opción:</b> ${best[2]}`:''}</div><div class="tool">🛠️ <b>Herramienta mental:</b> ${m.tip}</div><button class="btn wide" style="margin-top:14px" id="nx">${S.i>=N?'Ver resultado':'Siguiente misión →'}</button>`;
    $('#nx').onclick=show;$('#vf').scrollIntoView({behavior:'smooth',block:'nearest'});
   });
  }
  show();
  function done(){finish('vida',S.score,S.pts>=8?1:S.pts<=4?-1:0,[`🧭 Puntos de decisión: ${S.pts} de ${N*3}`,'💬 Idea: comentad en familia alguna de las misiones. ¿Qué habríais hecho?'],cheerFor(S.pts/(N*3)),S.pts===N*3)}
 });
}

function audio(){if(st.sound===false)return null;try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;actx=new AC()}if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}}

const GSOUND={pop:['triangle',[0,4,7,12],150],rock:['sawtooth',[0,5,7,12],150],indie:['triangle',[0,2,7,9],120],rap:['square',[0,3,5,7],110],electro:['square',[0,7,12,19],165],latino:['triangle',[0,4,7,9],150],kpop:['square',[0,4,7,11],170],flamenco:['triangle',[0,1,4,5],135],jazz:['sine',[0,4,7,11],115],clasica:['sine',[0,4,7,12],105],metal:['sawtooth',[0,3,7,10],175],reggae:['triangle',[0,4,7,9],95],country:['triangle',[0,2,4,7],125]};
function jingle(kind){
 const c=audio();if(!c)return;
 const [wave,iv,bpm]=GSOUND[(st.artist||{}).genre]||GSOUND.pop,beat=60/bpm/2,base=62;
 const seq={level:[0,1,2,3,4],win:[0,2,1,3,4,4],disco:[4,3,4,6],stage:[0,1,2,3,2,3,4,6],fail:[2,0]}[kind]||[0,2];
 seq.forEach((n,i)=>{const t=c.currentTime+0.02+i*beat,o=c.createOscillator(),g=c.createGain();
  const midi=base+iv[n%4]+Math.floor(n/4)*12;o.type=wave;o.frequency.value=440*Math.pow(2,(midi-69)/12);
  const vol=wave==='sine'?0.16:wave==='triangle'?0.12:0.05;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+beat*(i===seq.length-1?3:1.5));
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+beat*3.2)});
}

const TRIM=['repaso de 1º','1.er trimestre','2.º trimestre','3.er trimestre'];
function curTrim(){const m=new Date().getMonth()+1;return m>=9?1:m<=3?2:m<=6?3:3}
/* --- trivial de clase adaptativo --- */
const bucketOf=Q=>Q[0]+'|'+Q[2];
const bucketName=key=>{const [s,t]=key.split('|');return `${s} · ${TRIM[+t]}`};
function tq(){st.tq=st.tq||{q:{},notYet:{},subj:{}};return st.tq}
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dayStr(d)};
function notYetActive(key){const until=tq().notYet[key];return until&&until>today()}
function bucketStats(key){let ok=0,ko=0;TRIVIA.forEach((Q,i)=>{if(bucketOf(Q)===key){const r=tq().q[i];if(r){ok+=r.ok;ko+=r.ko}}});return{ok,ko,n:ok+ko,acc:ok+ko?ok/(ok+ko):null}}
const bucketLow=key=>{const b=bucketStats(key);return b.n>=3&&b.acc<0.35};
function subjLevel(subj,base){const h=(tq().subj[subj]||[]);if(h.length<5)return base;const acc=h.reduce((a,b)=>a+b,0)/h.length;return Math.max(1,Math.min(3,base+(acc>=0.8?1:acc<0.4?-1:0)))}
function pickAdaptive(allowed,N,base){
 const T=tq(),cand=allowed.filter(([Q])=>!notYetActive(bucketOf(Q)));
 const src=cand.length>=N?cand:allowed;
 const w=src.map(([Q,i])=>{
  const r=T.q[i],sl=subjLevel(Q[0],base);let x=Q[1]<=sl?1:Q[1]===sl+1?0.35:0.08;
  if(bucketLow(bucketOf(Q)))x*=0.2;
  if(r){if(r.ko>r.ok&&r.last!==today())x*=2.5;else if(r.ok>=2&&r.ko===0)x*=0.25;if(r.last===today())x*=0.1}
  return x});
 const out=[],per={},idx=src.map((_,j)=>j);
 while(out.length<N&&idx.length){
  let tot=0;const ws=idx.map(j=>{const s=src[j][0][0];const v=w[j]*((per[s]||0)>=3?0.05:1);tot+=v;return v});
  let r0=Math.random()*tot,pick=0;for(let m=0;m<idx.length;m++){r0-=ws[m];if(r0<=0){pick=m;break}}
  const j=idx.splice(pick,1)[0];out.push(src[j]);const s=src[j][0][0];per[s]=(per[s]||0)+1;
 }
 return out;
}
function recordTQ(i,Q,good){const T=tq(),r=T.q[i]=T.q[i]||{ok:0,ko:0,last:''};good?r.ok++:r.ko++;r.last=today();const h=T.subj[Q[0]]=(T.subj[Q[0]]||[]);h.push(good?1:0);if(h.length>8)h.shift()}
function quizTopics(){
 const tr=curTrim(),keys=[...new Set(TRIVIA.filter(Q=>Q[2]<=tr).map(bucketOf))];
 const row=key=>{const b=bucketStats(key),ny=notYetActive(key),low=!ny&&bucketLow(key);
  const state=ny?`🙈 Aún no lo habéis dado · vuelve a salir el ${tq().notYet[key].split('-').reverse().join('/')}`:low?'🤔 Fallas bastante: sale menos (¿quizá aún no lo habéis dado?)':'✅ Activo';
  return `<div><span>${ny?'🙈':low?'🤔':'✅'}</span><div><b>${bucketName(key)}</b><small>${state}${b.n?` · ${b.ok}/${b.n} aciertos`:''}</small></div><button class="chip" data-k="${key}" data-ny="${ny?1:0}">${ny?'Ya lo hemos dado':'Aún no'}</button></div>`};
 screen('📚 Temas del trivial',`<p class="lead">Aquí ves los temas que pueden salir ahora mismo. Si un tema todavía no lo habéis dado en clase, márcalo con <b>«Aún no»</b> y no saldrá durante 3 semanas. Cuando lo deis, pulsa <b>«Ya lo hemos dado»</b>.</p><div class="hist" id="tl">${keys.map(row).join('')}</div>`);
 $('#tl').querySelectorAll('button').forEach(bt=>bt.onclick=()=>{const T=tq();if(bt.dataset.ny==='1'){delete T.notYet[bt.dataset.k];const b=bucketStats(bt.dataset.k);if(bucketLow(bt.dataset.k))TRIVIA.forEach((Q,i)=>{if(bucketOf(Q)===bt.dataset.k&&T.q[i])T.q[i].ko=0})}else T.notYet[bt.dataset.k]=addDays(21);save();quizTopics()});
}

function playQuiz(k){
 const lv=ctx.lv,N=10,BK=bankFor(ctx.curso||myCurso(),k),bank=BK.bank,tr=curTrim(),maxD=lv<=3?1:lv<=6?2:3,band=BANDIDX[bandOf(ctx.curso||myCurso())];
 const allowed=bank.map((q,i)=>[q,i]).filter(([q])=>BK.kind==='class'?q[2]<=tr:BK.kind==='gen'?q[2]<=band:true);
 let pool=allowed.filter(([q])=>q[1]<=maxD);if(pool.length<N)pool=allowed;
 const adapt=BK.kind==='class'&&ctx.mode==='solo';
 const extra=BK.kind==='gen'?`Preguntas de cultura general para ${cursoName(ctx.curso||myCurso())}. Al responder verás la explicación.`:k==='trivia'?`Preguntas de lo que se suele dar hasta ahora en 2º de ESO (<b>${TRIM[tr]}</b>) y repaso de 1º.${adapt?' Si te sale algo que aún no habéis dado, pulsa <b>«🙈 Aún no lo hemos dado»</b> y no contará como fallo.<br><br><button class="chip" id="qTopics">📚 Ver y elegir los temas</button>':''}`:'Cantantes, canciones, instrumentos y lo que das en clase de música. Al responder verás la explicación.';
 intro(k,`Son ${N} preguntas. ${extra}`,()=>{
  const seenK='quiz_'+k,seen=ctx.mode==='solo'?((st.quizSeen||{})[seenK]||[]):[];
  const list=adapt?pickAdaptive(allowed,N,maxD):shuffle(pool).sort((a,b)=>seen.includes(a[1])-seen.includes(b[1])).slice(0,N);
  const roundRes={},lowBefore=adapt?new Set([...new Set(allowed.map(([Q])=>bucketOf(Q)))].filter(bucketLow)):new Set();
  if(ctx.mode==='solo'&&!adapt){st.quizSeen=st.quizSeen||{};st.quizSeen[seenK]=[...seen,...list.map(x=>x[1])].slice(-Math.floor(allowed.length*0.7));save()}
  const S={i:0,ok:0,score:0,t0:0,skip:0};const b=frame(k,false);
  function q(){
   if(S.i>=list.length)return done();
   const [Q,qi]=list[S.i];S.i++;
   const opts=shuffle([Q[4],...Q[5]]);
   b.innerHTML=`<div class="info">Pregunta ${S.i} de ${list.length}</div><span class="qtag">${Q[0]}${BK.kind==='class'&&Q[2]?' · '+TRIM[Q[2]]:''}</span><div class="qtext">${Q[3]}</div><div class="vopts">${opts.map(o=>`<button class="vopt" data-v="${esc(o)}">${o}</button>`).join('')}</div>${adapt?'<button class="skipq" id="skq">🙈 Aún no lo hemos dado</button>':''}<div id="ex"></div>`;
   if(adapt)$('#skq').onclick=()=>{
    const key=bucketOf(Q);tq().notYet[key]=addDays(21);S.skip++;save();
    const rest=list.slice(S.i).map(x=>x[1]);const more=pickAdaptive(allowed.filter(([QQ,ii])=>!rest.includes(ii)&&ii!==qi),1,maxD)[0];
    list.splice(S.i-1,1);S.i--;if(more&&!notYetActive(bucketOf(more[0])))list.splice(S.i,0,more);
    toast(`🙈 Vale: <b>${bucketName(key)}</b> no saldrá durante 3 semanas.`);q()};
   b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');S.t0=Date.now();
   b.querySelectorAll('.vopt').forEach(bt=>bt.onclick=()=>{
    const good=bt.dataset.v===Q[4];
    b.querySelectorAll('.vopt').forEach(x=>{x.disabled=true;if(x.dataset.v===Q[4])x.classList.add('p3')});
    if(good){S.ok++;S.score+=10+(Date.now()-S.t0<8000?5:0);setScore(S.score)}else bt.classList.add('p0');
    if(ctx.answers)ctx.answers.push([qi,good?1:0]);
    if(adapt){recordTQ(qi,Q,good);const rr=roundRes[Q[0]]=roundRes[Q[0]]||[0,0];rr[1]++;if(good)rr[0]++;save();if($('#skq'))$('#skq').remove()}
    $('#ex').innerHTML=`<div class="explain">${good?'✅ ¡Correcto!':'❌ Era: <b>'+Q[4]+'</b>.'} ${Q[6]||''}</div><button class="btn wide" style="margin-top:14px" id="nx">${S.i>=list.length?'Ver resultado':'Siguiente →'}</button>`;
    $('#nx').onclick=q;$('#ex').scrollIntoView({behavior:'smooth',block:'nearest'});
   });
  }
  q();
  function done(){
   const n=Math.max(1,list.length),lines=[`✅ Aciertos: ${S.ok} de ${list.length}`];
   if(adapt){
    const sub=Object.entries(roundRes).map(([s2,[o,t]])=>`${s2} ${o}/${t}`).join(' · ');if(sub)lines.push('📊 '+sub);
    const nowLow=[...new Set(allowed.map(([Q])=>bucketOf(Q)))].filter(x=>bucketLow(x)&&!lowBefore.has(x)&&!notYetActive(x));
    nowLow.forEach(x=>lines.push(`🤔 Fallas bastante en <b>${bucketName(x)}</b>. ¿Puede que aún no lo hayáis dado? Saldrá menos (puedes cambiarlo en «Ver y elegir los temas»).`));
    if(S.skip)lines.push(`🙈 Has marcado ${S.skip} ${S.skip===1?'tema':'temas'} como «aún no lo hemos dado».`);
   }else lines.push('⚡ Si respondes en menos de 8 segundos ganas puntos extra.');
   finish(k,S.score,S.ok/n>=0.8?1:S.ok/n<=0.4?-1:0,lines,cheerFor(S.ok/n),S.ok===list.length&&list.length>=8)}
 });
 const tb=$('#qTopics');if(tb)tb.onclick=quizTopics;
}

function sfx(kind){
 const c=audio();if(!c)return;const T=c.currentTime+0.02;
 const tone=(f,t,d,w='sawtooth',v=0.08,f2)=>{const o=c.createOscillator(),g=c.createGain();o.type=w;o.frequency.setValueAtTime(f,T+t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+t+d);g.gain.setValueAtTime(0.0001,T+t);g.gain.exponentialRampToValueAtTime(v,T+t+0.02);g.gain.setValueAtTime(v,T+t+d*0.7);g.gain.exponentialRampToValueAtTime(0.0001,T+t+d);o.connect(g);g.connect(c.destination);o.start(T+t);o.stop(T+t+d+0.05)};
 const noise=(t,d,v,fq)=>{const n=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),a=n.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,3);const s=c.createBufferSource(),bf=c.createBiquadFilter(),g=c.createGain();s.buffer=n;bf.type='bandpass';bf.frequency.value=fq||1500;bf.Q.value=0.8;g.gain.value=v;s.connect(bf);bf.connect(g);g.connect(c.destination);s.start(T+t)};
 switch(kind){
  case 'fanfare':[[523,0,.14],[659,.14,.14],[784,.28,.14],[1047,.42,.5]].forEach(([f,t,d])=>{tone(f,t,d,'square',0.05);tone(f/2,t,d,'triangle',0.06)});break;
  case 'applause':for(let i=0;i<70;i++)noise(Math.random()*1.6,0.05+Math.random()*0.05,0.25+Math.random()*0.3,1200+Math.random()*1800);break;
  case 'airhorn':[0,.42].forEach(t=>{[466,470,698].forEach(f=>tone(f,t,.36,'sawtooth',0.035))});break;
  case 'laugh':[[520,0],[470,.14],[430,.28],[400,.42],[370,.56]].forEach(([f,t])=>{tone(f,t,.11,'sawtooth',0.06,f*0.82);tone(f*2.4,t,.09,'sine',0.02,f*1.9)});break;
  case 'trombone':[[311,0,.42],[294,.45,.42],[277,.9,.42],[262,1.35,1.1]].forEach(([f,t,d])=>{tone(f,t,d,'sawtooth',0.07,t>1?f*0.94:undefined);tone(f/2,t,d,'triangle',0.05)});break;
  case 'drumroll':for(let i=0;i<18;i++)noise(i*0.04,0.05,0.5,300+i*20);noise(0.75,0.4,0.9,180);tone(1047,0.78,.4,'triangle',0.05);break;
 }
}

async function groupDayDone(k,score,r0){
 const c=ctx;loadingScreen('💾 Guardando…');
 try{
  await fbInit();
  const ref=dayRef(c.gid).doc(fb.uid);const ex=await ref.get();const prev=ex.exists?ex.data():{};
  // ranking ANTES de mi partida (para picar)
  const before=await dayRef(c.gid).get();const others=before.docs.filter(d=>d.id!==fb.uid&&d.data()[k]).map(d=>({uid:d.id,name:d.data().name,score:d.data()[k].s}));
  if(!prev[k]){const entry={s:Math.round(score)};if(c.answers&&c.answers.length&&(k==='trivia'||k==='musica')){entry.a=c.answers.slice(0,15).map(([qi,ok])=>qi*2+ok);entry.b=bankFor(c.curso||myCurso(),k).id}
   await ref.set({name:artistName().slice(0,30),[k]:entry},{merge:true})}
  gRef(c.gid).collection('members').doc(fb.uid).set(memberDoc()).catch(()=>{});
  const all=rankResults([...others,{uid:fb.uid,name:artistName(),score:prev[k]?prev[k].s:Math.round(score)}]);
  const mine=all.find(r=>r.uid===fb.uid),passed=others.filter(o=>o.score<score),ahead=others.filter(o=>o.score>score).sort((a,b)=>a.score-b.score);
  const first=mine.pos===0&&others.length>0;
  const taunt=prev[k]?'Ya habías jugado este juego hoy: cuenta tu primera partida.':first?pickTaunt(TAUNTS_UP):passed.length?TAUNTS_PASS(passed[0].name):ahead.length?TAUNTS_DOWN(ahead[0].name):'¡Eres la primera persona en jugar hoy! A ver quién te supera 😏';
  screen(`${c.gemoji||'👥'} ${esc(c.gname)}`,`<div class="result"><div class="big">${first?'👑':passed.length?'😜':ahead.length?'😤':'🎯'}</div><h2 class="f">${score} puntos</h2><div class="taunt">${taunt}</div>
   <div class="lab" style="text-align:left">${GAMES[k].icon} ${GAMES[k].name} · hoy</div><div class="ranking">${all.map(r=>`<div class="${r.uid===fb.uid?'meR':''}"><span>${MED[r.pos]||r.pos+1+'º'}</span><b>${esc(r.name)}${r.uid===fb.uid?' (tú)':''}</b><em>${r.score} pts</em></div>`).join('')}</div>
   <button class="btn wide" id="bg" style="margin-top:16px">Volver al grupo</button></div>`);
  $('#bg').onclick=()=>groupScreen(c.gid);$('#exit').onclick=()=>groupScreen(c.gid);
  if(!prev[k]){if(first){confetti();sfx('airhorn');setTimeout(()=>sfx('applause'),900)}else if(passed.length){sfx('laugh');setTimeout(()=>sfx('applause'),700)}else if(ahead.length)sfx('trombone');else sfx('fanfare')}
  celebrate(r0,false,false);
 }catch(e){screen('💾 Guardar',`<div class="intro"><div class="big">📡</div><p>${fbErr(e)}</p><p class="lead">Tu puntuación: <b>${score}</b>.</p><button class="btn" id="rt">Reintentar</button></div>`);$('#rt').onclick=()=>groupDayDone(k,score,r0)}
}

 screen('🏅 Mis retos y rankings',html);curView='rank';
 $('#rtab').querySelectorAll('.chip').forEach(c=>c.onclick=()=>myRanking(c.dataset.v));
 const lr=$('#lreset');if(lr)lr.onclick=()=>{$('#lconf').innerHTML=`<p style="font-weight:700">¿Seguro? Se borrará la liga del grupo (no afecta a los retos).</p><div class="row"><button class="btn ghost" id="lno">No</button><button class="btn" id="lyes" style="background:var(--bad);box-shadow:0 6px 0 #a3272b">Sí, reiniciar</button></div>`;$('#lno').onclick=()=>myRanking('grupo');$('#lyes').onclick=()=>{st.league={};save();myRanking('grupo')}};
}

/* --- Modo grupo (un solo dispositivo) --- */
let G=null;
function groupSetup(){
 let names=(st.groupNames&&st.groupNames.length>=2)?st.groupNames.slice():[st.name,''];
 let game='mix',lv=5;
 const b=screen('👥 Modo grupo',`<p class="lead">Escribid vuestros nombres. Todos jugaréis <b>los mismos retos</b> por turnos, pasándoos el móvil.</p>
 <div class="lab">Jugadores</div><div id="pl"></div><button class="chip" id="addp" style="margin-top:8px">＋ Añadir jugador</button>
 <div class="lab">Juego</div>${chipsHTML('gg',[['mix','🏆 Torneo (3 juegos)'],...gameItems()],game)}
 <div class="lab">Dificultad</div>${chipsHTML('gd',DIFF.map(([l,v])=>[String(v),l]),'5')}
 <button class="btn wide" id="gstart" style="margin-top:18px">¡A jugar!</button><div class="fb" id="gfb" style="color:var(--bad)"></div>`);
 const drawP=()=>{$('#pl').innerHTML=names.map((n,i)=>`<div class="prow"><input type="text" maxlength="14" data-i="${i}" value="${esc(n)}" placeholder="Jugador ${i+1}">${names.length>2?`<button class="iconbtn" data-del="${i}">✕</button>`:''}</div>`).join('');
  $('#pl').querySelectorAll('input').forEach(x=>x.oninput=()=>names[+x.dataset.i]=x.value);
  $('#pl').querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{names.splice(+x.dataset.del,1);drawP()});
  $('#addp').style.display=names.length>=8?'none':''};
 drawP();
 $('#addp').onclick=()=>{names.push('');drawP();const ins=$('#pl').querySelectorAll('input');ins[ins.length-1].focus()};
 bindChips('gg',v=>game=v);bindChips('gd',v=>lv=+v);
 $('#gstart').onclick=()=>{
  const ps=names.map(n=>n.trim()).filter(Boolean);
  if(ps.length<2){$('#gfb').textContent='Hacen falta al menos 2 jugadores.';return}
  if(new Set(ps.map(p=>p.toLowerCase())).size!==ps.length){$('#gfb').textContent='Hay dos nombres iguales: añadid una inicial para distinguirlos.';return}
  st.groupNames=ps;save();
  const games=game==='mix'?shuffle(['mem','calc','stroop','series','trivia','musica']).slice(0,3):[game];
  G={players:ps,games,lv,seeds:games.map(newSeed),round:0,turn:0,res:games.map(()=>[]),totals:ps.map(()=>0)};
  groupTurn();
 };
}
function groupTurn(){
 const p=G.players[G.turn],k=G.games[G.round];
 launch(k,{mode:'group',lv:G.lv,seed:G.seeds[G.round],player:p,banner:`📱 Turno de <b>${esc(p)}</b>${G.games.length>1?` · Ronda ${G.round+1} de ${G.games.length}`:''}`});
}
function groupDone(score){
 G.res[G.round][G.turn]=score;
 const p=G.players[G.turn];G.turn++;
 const last=G.turn>=G.players.length;
 const b=screen('👥 Modo grupo',`<div class="result"><div class="big">🎯</div><h2 class="f">${esc(p)}: ${score} puntos</h2>
 ${last?'<p class="lead">¡Ya habéis jugado todos esta ronda!</p><button class="btn wide" id="nx">Ver resultados de la ronda</button>':`<p class="lead">Ahora pásale el móvil a…</p><div class="code" style="font-size:26px">${esc(G.players[G.turn])}</div><p class="lead" style="font-size:13.5px">¡Sin mirar su pantalla! 🙈</p><button class="btn wide" id="nx">Soy ${esc(G.players[G.turn])}, ¡empiezo!</button>`}</div>`);
 $('#exit').onclick=()=>{G=null;home()};
 $('#nx').onclick=last?roundResults:groupTurn;
}
function rankList(vals){const order=vals.map((v,i)=>i).sort((a,b)=>vals[b]-vals[a]);const pos=[];order.forEach((i,j)=>{pos[i]=j>0&&vals[i]===vals[order[j-1]]?pos[order[j-1]]:j});return{order,pos}}
const MED=['🥇','🥈','🥉'];
function roundResults(){
 const sc=G.res[G.round],n=G.players.length,{order,pos}=rankList(sc);
 sc.forEach((v,i)=>G.totals[i]+=n-pos[i]);
 const k=G.games[G.round],more=G.round+1<G.games.length;
 const b=screen(`${GAMES[k].icon} Resultados`,`<div class="lead" style="text-align:center">${GAMES[k].name}${G.games.length>1?` · Ronda ${G.round+1} de ${G.games.length}`:''}</div>
 <div class="ranking">${order.map(i=>`<div><span>${MED[pos[i]]||(pos[i]+1)+'º'}</span><b>${esc(G.players[i])}</b><em>${sc[i]} pts</em>${G.games.length>1?`<small>+${n-pos[i]}</small>`:''}</div>`).join('')}</div>
 <button class="btn wide" id="nx" style="margin-top:16px">${more?'Siguiente ronda →':'Ver el podio final 🏆'}</button>`);
 $('#exit').onclick=()=>{G=null;home()};
 $('#nx').onclick=()=>{if(more){G.round++;G.turn=0;groupTurn()}else podium()};
}
function podium(){
 const multi=G.games.length>1,vals=multi?G.totals:G.res[0],{order,pos}=rankList(vals);
 if(!G.saved){G.saved=true;st.league=st.league||{};const n=G.players.length;
  G.players.forEach((p,i)=>{const key=p.toLowerCase();const L=st.league[key]=st.league[key]||{n:p,games:0,wins:0,pods:0,pts:0};L.n=p;L.games++;if(pos[i]===0)L.wins++;if(pos[i]<=2)L.pods++;L.pts+=n-pos[i]});st.stats.group++;save();confetti();jingle('win');checkDiscos()}
 const top=order.filter(i=>pos[i]===0).map(i=>esc(G.players[i]));
 const b=screen('🏆 Podio',`<div class="result"><div class="big">🎉</div><h2 class="f">${top.length>1?'¡Empate entre '+top.join(' y ')+'!':'¡'+top[0]+' gana!'}</h2>
 <div class="ranking">${order.map(i=>`<div><span>${MED[pos[i]]||(pos[i]+1)+'º'}</span><b>${esc(G.players[i])}</b><em>${vals[i]} ${multi?'puntos de torneo':'pts'}</em></div>`).join('')}</div>
 ${multi?'<p class="lead" style="font-size:13.5px">En cada ronda, el 1º suma tantos puntos como jugadores hay, el 2º uno menos, y así sucesivamente.</p>':''}
 <div class="row"><button class="btn ghost" id="hm">Inicio</button><button class="btn" id="again">Revancha</button></div></div>`);
 $('#hm').onclick=()=>{G=null;home()};
 $('#again').onclick=()=>{const games=G.games.length>1?shuffle(['mem','calc','stroop','series','trivia','musica']).slice(0,3):G.games;G=Object.assign(G,{games,seeds:games.map(newSeed),round:0,turn:0,res:games.map(()=>[]),totals:G.players.map(()=>0)});groupTurn()};
}

/* --- arranque y enlaces de reto --- */
function readHash(){const h=decodeURIComponent(location.hash.slice(1));if(/^reto-/i.test(h)){const c=parseCode(h);if(c)pending=c}else if(/^res-/i.test(h)){const c=parseResult(h);if(c)pendingRes=c}else{const m=h.match(/^grupo-([a-z0-9]{6,20})$/i);if(m)pendingGroup=m[1].toLowerCase()}}
function openPending(){if(pendingGroup)return joinScreen(pendingGroup),true;if(pending)return challengeIntro(pending),true;if(pendingRes)return resultIntro(pendingRes),true;return false}
const isApp=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
function openInApp(){
 const h=decodeURIComponent(location.hash.slice(1));let code='',what='';
 if(pendingGroup){code=pendingGroup.toUpperCase();what='una invitación a un grupo'}
 else if(pending){code=h.replace(/^reto-/i,'').toUpperCase();what='un reto'}
 else if(pendingRes){code=h.replace(/^res-/i,'').toUpperCase();what='un resultado'}
 view.innerHTML=`<div class="panel pop" style="margin-top:24px;text-align:center"><div style="font-size:56px">📲</div><h1 class="f" style="font-size:24px;margin:6px 0">Te han mandado ${what}</h1>
  <p class="lead"><b>¿Ya tienes la app Gimnasio Mental en tu pantalla de inicio?</b> Copia este código, abre la app y pégalo en <b>«🎟️ Tengo un código»</b>:</p>
  <div class="code">${esc(code)}</div><button class="btn wide" id="oCopy">📋 Copiar código</button><div class="fb" id="oFb"></div>
  <div style="border-top:1px dashed var(--line);margin:18px 0 12px"></div>
  <p class="lead" style="font-size:14px"><b>¿Aún no tienes la app?</b> Si estás dentro de WhatsApp, abre este enlace en <b>Chrome</b> o <b>Safari</b> (menú ⋮ → «Abrir en el navegador»). Después añádela a la pantalla de inicio para que se guarde tu progreso.</p>
  <button class="btn ghost wide" id="oHere">Seguir aquí</button></div>`;
 $('#oCopy').onclick=async()=>{try{await navigator.clipboard.writeText(code);$('#oFb').textContent='✅ ¡Copiado! Ahora abre la app y pégalo en «Tengo un código».'}catch(e){$('#oFb').textContent='Mantén pulsado el código para copiarlo.'}};
 $('#oHere').onclick=()=>{try{sessionStorage.setItem('gm-here','1')}catch(e){}if(!st.name)return nameScreen();if(!st.artist)return artistEditor(true);if(!openPending())home()};
}
function boot(){applyProfile();readHash();const linked=pendingGroup||pending||pendingRes;let here=false;try{here=sessionStorage.getItem('gm-here')==='1'}catch(e){}
 if(linked&&!isApp()&&!here)return openInApp();
 if(!st.name)return nameScreen();if(!openPending())home()}
window.addEventListener('hashchange',()=>{readHash();if(st.name){cleanup();openPending()}});
boot();initCloud();
</script>
</body>
</html>
